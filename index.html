<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fathima Parveena — Strategy & Production</title>
  <meta name="description" content="Senior Account Manager → Strategy & Production. Kozhikode.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Libre+Franklin:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    :root {
      --bg:           #F5F4F0;
      --bg-white:     #FAFAF8;
      --ink:          #1A1917;
      --ink-mid:      #5A5855;
      --ink-faint:    #9E9C97;
      --accent:       #C94A1A;
      --accent-light: #F2E8E3;
      --navy:         #0C1C2E;
      --navy-mid:     #1A3050;
      --border:       #DDD9D3;
      --white:        #FFFFFF;

      --font-display: 'Syne', sans-serif;
      --font-body:    'Libre Franklin', sans-serif;

      --max-w:        1100px;
      --pad-h:        60px;
      --section-v:    120px;
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 1.08rem;
      line-height: 1.82;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; }

    /* ── NAV ─────────────────────────────────────────── */
    #nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      height: 64px;
      padding: 0 var(--pad-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(245, 244, 240, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid transparent;
      transition: border-color 0.4s ease;
    }
    #nav.scrolled { border-color: var(--border); }

    .nav-name {
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink);
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 36px;
    }
    .nav-link {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-mid);
      transition: color 0.2s;
    }
    .nav-link:hover { color: var(--ink); }
    .nav-cta {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--white);
      background: var(--accent);
      padding: 8px 20px;
      transition: background 0.2s;
    }
    .nav-cta:hover { background: #a83a12; }

    /* ── HERO ────────────────────────────────────────── */
    #hero {
      min-height: 100vh;
      padding: 110px var(--pad-h) 90px;
      display: grid;
      grid-template-columns: 55% 45%;
      align-items: center;
      gap: 60px;
      position: relative;
      overflow: hidden;
    }

    .hero-left { position: relative; z-index: 2; }

    .hero-eyebrow {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .hero-eyebrow::before {
      content: '';
      display: inline-block;
      width: 36px;
      height: 2px;
      background: var(--accent);
      flex-shrink: 0;
    }

    .hero-headline {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2.8rem, 4.8vw, 5rem);
      line-height: 1.05;
      color: var(--ink);
      margin-bottom: 32px;
      letter-spacing: -0.02em;
    }

    .hero-sub {
      font-size: 1.15rem;
      font-weight: 300;
      color: var(--ink-mid);
      line-height: 1.85;
      max-width: 520px;
      margin-bottom: 60px;
    }

    .hero-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px 40px;
      padding-top: 36px;
      border-top: 1px solid var(--border);
    }
    .meta-label {
      font-family: var(--font-display);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 4px;
    }
    .meta-value {
      font-size: 1rem;
      font-weight: 400;
      color: var(--ink);
    }
    .meta-value a {
      border-bottom: 1px solid var(--border);
      transition: border-color 0.2s, color 0.2s;
    }
    .meta-value a:hover { color: var(--accent); border-color: var(--accent); }

    .hero-right {
      position: relative;
      align-self: stretch;
      min-height: 520px;
    }
    .hero-img-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .hero-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }
    .hero-img-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to left, transparent 55%, var(--bg) 100%);
      z-index: 1;
    }

    .scroll-hint {
      position: absolute;
      bottom: 44px;
      left: var(--pad-h);
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: var(--font-display);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }
    .scroll-hint::after {
      content: '';
      display: block;
      width: 48px;
      height: 1px;
      background: var(--ink-faint);
    }

    /* ── SECTION CHROME ──────────────────────────────── */
    .section-wrap {
      max-width: calc(var(--max-w) + (var(--pad-h) * 2));
      margin: 0 auto;
      padding: var(--section-v) var(--pad-h);
    }
    .section-header { margin-bottom: 72px; }
    .section-eyebrow {
      font-family: var(--font-display);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }
    .section-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2rem, 3vw, 3rem);
      line-height: 1.12;
      color: var(--ink);
      letter-spacing: -0.02em;
    }

    /* ── PRINCIPLES ──────────────────────────────────── */
    #principles { background: var(--navy); }
    #principles .section-eyebrow { color: #FF7A50; }
    #principles .section-title   { color: #FFFFFF; }

    .principles-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.08);
    }
    .principle {
      padding: 48px 44px;
      background: var(--navy);
      transition: background 0.3s;
      border-left: 3px solid transparent;
    }
    .principle:hover {
      background: var(--navy-mid);
      border-left-color: #FF7A50;
    }

    .principle-num {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 3.2rem;
      line-height: 1;
      color: #FF7A50;
      opacity: 0.35;
      margin-bottom: 24px;
      letter-spacing: -0.03em;
    }
    .principle-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.4;
      color: #FFFFFF;
      margin-bottom: 16px;
      letter-spacing: -0.01em;
    }
    .principle-body {
      font-size: 1rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.78);
      line-height: 1.85;
    }

    /* ── CASE STUDIES ────────────────────────────────── */
    .case-study {
      border-top: 2px solid var(--border);
    }
    .case-inner {
      max-width: calc(var(--max-w) + (var(--pad-h) * 2));
      margin: 0 auto;
      padding: 80px var(--pad-h);
    }

    .case-header {
      display: flex;
      align-items: flex-start;
      gap: 32px;
      margin-bottom: 60px;
    }
    .case-num {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 4rem;
      line-height: 1;
      color: var(--border);
      flex-shrink: 0;
      margin-top: -4px;
      letter-spacing: -0.04em;
    }
    .case-title {
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 2.4vw, 2.4rem);
      font-weight: 800;
      line-height: 1.1;
      color: var(--ink);
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    .case-subtitle {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .case-narrative {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 40px;
      margin-bottom: 48px;
    }
    .narr-label {
      font-family: var(--font-display);
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .narr-text {
      font-size: 1.02rem;
      font-weight: 300;
      color: var(--ink-mid);
      line-height: 1.85;
    }

    .case-results {
      background: var(--navy);
      padding: 36px 44px;
      margin-bottom: 48px;
    }
    .results-label {
      font-family: var(--font-display);
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #FF7A50;
      margin-bottom: 20px;
    }
    .results-list {
      list-style: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 48px;
    }
    .results-list li {
      font-size: 1rem;
      font-weight: 400;
      color: #FFFFFF;
      padding-left: 20px;
      position: relative;
      line-height: 1.6;
    }
    .results-list li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: #FF7A50;
      font-size: 0.85em;
    }

    .case-photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 12px;
    }
    .case-photo {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
    }

    .case-video {
      position: relative;
      cursor: pointer;
      overflow: hidden;
      margin-bottom: 52px;
    }
    .case-video img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }
    .case-video:hover img { transform: scale(1.02); }
    .video-overlay {
      position: absolute;
      inset: 0;
      background: rgba(12, 28, 46, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      transition: background 0.3s;
    }
    .case-video:hover .video-overlay { background: rgba(12, 28, 46, 0.75); }
    .play-circle {
      width: 68px;
      height: 68px;
      border: 2px solid rgba(255,255,255,0.85);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s, border-color 0.3s;
      flex-shrink: 0;
    }
    .case-video:hover .play-circle {
      background: var(--accent);
      border-color: var(--accent);
    }
    .play-circle svg { margin-left: 5px; }
    .video-label-text {
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #FFFFFF;
    }

    .case-takeaway {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.5rem, 2.2vw, 2.1rem);
      line-height: 1.35;
      color: var(--ink);
      padding: 40px 0 0 36px;
      border-top: 2px solid var(--border);
      position: relative;
      letter-spacing: -0.02em;
    }
    .case-takeaway::before {
      content: '"';
      position: absolute;
      left: 0;
      top: 32px;
      font-size: 2.8rem;
      line-height: 1;
      color: var(--accent);
      font-family: Georgia, serif;
    }

    /* ── EXPERIENCE ──────────────────────────────────── */
    #experience { background: var(--bg-white); }
    #experience .section-title { color: var(--ink); }

    .exp-table {
      width: 100%;
      border-top: 2px solid var(--border);
    }
    .exp-row {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 56px;
      padding: 36px 0;
      border-bottom: 1px solid var(--border);
      align-items: start;
    }
    .exp-period {
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--ink-faint);
      padding-top: 4px;
      text-transform: uppercase;
    }
    .exp-role {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }
    .exp-company {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }
    .exp-note {
      font-size: 0.96rem;
      font-weight: 300;
      color: var(--ink-mid);
      line-height: 1.8;
    }

    /* ── CLOSING ─────────────────────────────────────── */
    #closing {
      background: var(--navy);
      text-align: center;
      padding: var(--section-v) var(--pad-h);
    }
    .closing-inner { max-width: 720px; margin: 0 auto; }
    .closing-label {
      font-family: var(--font-display);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #FF7A50;
      margin-bottom: 28px;
    }
    .closing-text {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(1.5rem, 2.4vw, 2.1rem);
      line-height: 1.55;
      color: #FFFFFF;
      margin-bottom: 56px;
      letter-spacing: -0.01em;
    }
    .closing-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 36px;
      flex-wrap: wrap;
    }
    .cta-primary {
      display: inline-block;
      padding: 16px 52px;
      background: var(--accent);
      color: #FFFFFF;
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: background 0.2s;
    }
    .cta-primary:hover { background: #a83a12; }
    .cta-secondary {
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.75);
      border-bottom: 1px solid rgba(255,255,255,0.3);
      padding-bottom: 3px;
      transition: color 0.2s, border-color 0.2s;
    }
    .cta-secondary:hover {
      color: #FFFFFF;
      border-color: rgba(255,255,255,0.7);
    }
    .footer-line {
      margin-top: 80px;
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.22);
    }

    /* ── SCROLL REVEAL ───────────────────────────────── */
    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .reveal.in { opacity: 1; transform: none; }

    /* ── RESPONSIVE ──────────────────────────────────── */
    @media (max-width: 960px) {
      :root { --pad-h: 32px; --section-v: 88px; }
      #hero { grid-template-columns: 1fr; padding: 110px var(--pad-h) 72px; }
      .hero-right { display: none; }
      .hero-sub { max-width: 100%; }
      .principles-grid { grid-template-columns: 1fr; }
      .case-narrative { grid-template-columns: 1fr; gap: 28px; }
      .results-list { grid-template-columns: 1fr; }
      .case-photos { grid-template-columns: 1fr 1fr; }
      .exp-row { grid-template-columns: 1fr; gap: 6px; }
      .nav-link { display: none; }
    }

    @media (max-width: 600px) {
      :root { --pad-h: 22px; --section-v: 72px; }
      .hero-meta { grid-template-columns: 1fr; }
      .case-photos { grid-template-columns: 1fr; }
      .case-header { flex-direction: column; gap: 10px; }
      .case-num { font-size: 2.8rem; }
      .principle { padding: 36px 28px; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav id="nav">
    <a href="#hero" class="nav-name" id="nav-name">Loading…</a>
    <div class="nav-right">
      <a href="#work" class="nav-link">Work</a>
      <a href="#experience" class="nav-link">Experience</a>
      <a href="#closing" class="nav-cta" id="nav-cta">Get in Touch</a>
    </div>
  </nav>

  <!-- HERO -->
  <section id="hero">
    <div class="hero-left">
      <p class="hero-eyebrow" id="hero-eyebrow"></p>
      <h1 class="hero-headline" id="hero-headline"></h1>
      <p class="hero-sub" id="hero-sub"></p>
      <div class="hero-meta" id="hero-meta"></div>
    </div>
    <div class="hero-right">
      <div class="hero-img-wrap">
        <img id="hero-img" src="" alt="">
      </div>
    </div>
    <div class="scroll-hint">Scroll</div>
  </section>

  <!-- PRINCIPLES -->
  <section id="principles">
    <div class="section-wrap">
      <div class="section-header">
        <p class="section-eyebrow">How I think</p>
        <h2 class="section-title">The way I approach work</h2>
      </div>
      <div class="principles-grid" id="principles-grid"></div>
    </div>
  </section>

  <!-- WORK INTRO -->
  <section id="work">
    <div class="section-wrap">
      <div class="section-header reveal">
        <p class="section-eyebrow">Selected Work</p>
        <h2 class="section-title">Three engagements. One through-line.</h2>
      </div>
    </div>
  </section>

  <!-- CASE STUDIES -->
  <div id="cases"></div>

  <!-- EXPERIENCE -->
  <section id="experience">
    <div class="section-wrap">
      <div class="section-header reveal">
        <p class="section-eyebrow">Experience</p>
        <h2 class="section-title">Where I've worked</h2>
      </div>
      <div class="exp-table" id="exp-table"></div>
    </div>
  </section>

  <!-- CLOSING -->
  <section id="closing">
    <div class="closing-inner">
      <p class="closing-label">What I'm looking for</p>
      <p class="closing-text" id="closing-text"></p>
      <div class="closing-actions">
        <a href="" class="cta-primary" id="cta-email">Get in Touch</a>
        <a href="" class="cta-secondary" id="cta-phone"></a>
      </div>
      <p class="footer-line" id="footer-line"></p>
    </div>
  </section>

  <script src="content.js"></script>
  <script>
    function render() {
      const C = CONTENT;
      const phone = '+91 ' + C.contact.phone;
      const phoneHref = '+91' + C.contact.phone;

      document.getElementById('nav-name').textContent = C.name;
      document.getElementById('nav-cta').href = `mailto:${C.contact.email}`;

      document.getElementById('hero-eyebrow').textContent = `${C.title} — ${C.location}`;
      document.getElementById('hero-headline').textContent = C.hero.headline;
      document.getElementById('hero-sub').textContent = C.hero.subtext;
      document.getElementById('hero-img').src = C.images.heroBg;
      document.getElementById('hero-img').alt = C.name;
      document.getElementById('hero-meta').innerHTML = `
        <div class="meta-item">
          <p class="meta-label">Name</p>
          <p class="meta-value">${C.name}</p>
        </div>
        <div class="meta-item">
          <p class="meta-label">Location</p>
          <p class="meta-value">${C.location}</p>
        </div>
        <div class="meta-item">
          <p class="meta-label">Email</p>
          <p class="meta-value"><a href="mailto:${C.contact.email}">${C.contact.email}</a></p>
        </div>
        <div class="meta-item">
          <p class="meta-label">Phone</p>
          <p class="meta-value"><a href="tel:${phoneHref}">${phone}</a></p>
        </div>
      `;

      const romans = ['I', 'II', 'III', 'IV'];
      document.getElementById('principles-grid').innerHTML = C.principles.map((p, i) => `
        <div class="principle reveal">
          <div class="principle-num">${romans[i]}</div>
          <p class="principle-title">${p.title}</p>
          <p class="principle-body">${p.body}</p>
        </div>
      `).join('');

      document.getElementById('cases').innerHTML = C.caseStudies.map(cs => {
        const thumb    = `https://img.youtube.com/vi/${cs.video.id}/maxresdefault.jpg`;
        const fallback = `https://img.youtube.com/vi/${cs.video.id}/hqdefault.jpg`;
        const photos   = cs.images.map((src, i) =>
          `<img class="case-photo" src="${src}" alt="${cs.title} — photo ${i+1}" loading="lazy">`
        ).join('');
        return `
        <article class="case-study">
          <div class="case-inner reveal">
            <div class="case-header">
              <span class="case-num">${cs.id}</span>
              <div>
                <h3 class="case-title">${cs.title}</h3>
                <p class="case-subtitle">${cs.subtitle}</p>
              </div>
            </div>
            <div class="case-narrative">
              <div class="narr-block">
                <p class="narr-label">The Situation</p>
                <p class="narr-text">${cs.situation}</p>
              </div>
              <div class="narr-block">
                <p class="narr-label">The Problem</p>
                <p class="narr-text">${cs.problem}</p>
              </div>
              <div class="narr-block">
                <p class="narr-label">What I Did</p>
                <p class="narr-text">${cs.action}</p>
              </div>
            </div>
            <div class="case-results">
              <p class="results-label">What it delivered</p>
              <ul class="results-list">
                ${cs.results.map(r => `<li>${r}</li>`).join('')}
              </ul>
            </div>
            <div class="case-photos">${photos}</div>
            <div class="case-video" onclick="window.open('https://www.youtube.com/watch?v=${cs.video.id}','_blank','noopener')">
              <img src="${thumb}" onerror="this.src='${fallback}'" alt="${cs.title} — watch film">
              <div class="video-overlay">
                <div class="play-circle">
                  <svg width="18" height="20" viewBox="0 0 16 18" fill="white">
                    <polygon points="1,1 15,9 1,17"/>
                  </svg>
                </div>
                <span class="video-label-text">${cs.video.label}</span>
              </div>
            </div>
            <p class="case-takeaway">${cs.takeaway}</p>
          </div>
        </article>`;
      }).join('');

      document.getElementById('exp-table').innerHTML = C.experience.map(e => `
        <div class="exp-row reveal">
          <p class="exp-period">${e.period}</p>
          <div>
            <p class="exp-role">${e.role}</p>
            <p class="exp-company">${e.company}</p>
            ${e.note ? `<p class="exp-note">${e.note}</p>` : ''}
          </div>
        </div>
      `).join('');

      document.getElementById('closing-text').textContent = C.closing;
      document.getElementById('cta-email').href = `mailto:${C.contact.email}`;
      document.getElementById('cta-phone').href = `tel:${phoneHref}`;
      document.getElementById('cta-phone').textContent = phone;
      document.getElementById('footer-line').textContent =
        `${C.name} · ${C.location} · ${C.contact.email}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      render();

      window.addEventListener('scroll', () => {
        document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 48);
      }, { passive: true });

      setTimeout(() => {
        const io = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('in');
              io.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal').forEach(el => io.observe(el));
      }, 80);
    });
  </script>
</body>
</html>
